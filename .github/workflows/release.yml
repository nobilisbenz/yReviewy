name: Release yReviewy

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Android release
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" bun run tauri android build --ci --apk --target aarch64

      - name: Sign and package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > /tmp/yreviewy-release.jks
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/zipalign" -p -f 4 \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
            yreviewy-android-arm64-aligned.apk
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/yreviewy-release.jks \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out yreviewy-android-arm64.apk \
            yreviewy-android-arm64-aligned.apk
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify yreviewy-android-arm64.apk
          mkdir release
          mv yreviewy-android-arm64.apk release/

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
